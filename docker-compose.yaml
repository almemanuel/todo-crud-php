services:
  # 1. Serviço da API PHP
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_php_api
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      # Sobrescreve o DB_HOST para o nome do container do postgres no Docker
      DB_HOST: postgres-db
      database.default.hostname: postgres-db
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - todo-network

  # 2. Serviço do Banco de Dados (TEM QUE FICAR DENTRO DE SERVICES)
  postgres-db:
    image: postgres:16-alpine
    container_name: todo_postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - todo-network

# Redes e Volumes ficam nas raízes do arquivo!
networks:
  todo-network:
    driver: bridge

volumes:
  pgdata:
